{% extends "base.html" %}
{% load static %}

{% block title %}본인 확인 — Todo Yorisa{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-card">
        <a href="/" class="auth-logo">🍳 Todo Yorisa</a>
        <h1 class="auth-title">본인 확인</h1>
        <p class="auth-desc">정보를 변경하려면 비밀번호를 다시 입력해 주세요.</p>

        {% if error %}
        <p class="form-error">{{ error }}</p>
        {% endif %}

        <form method="post" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" name="password" class="form-input js-no-space" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button type="submit" class="btn btn--primary btn--lg btn--full">확인</button>
        </form>

        <p class="auth-footer">
            <a href="{% url 'accounts:mypage' %}" class="auth-link">마이페이지로 돌아가기</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_script %}
<script src="{% static 'js/accounts.js' %}"></script>
{% endblock %}
