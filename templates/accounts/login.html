{% extends "base.html" %}

{% block title %}로그인 — Todo Yorisa{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-card">
        <a href="/" class="auth-logo">🍳 Todo Yorisa</a>
        <h1 class="auth-title">로그인</h1>
        <p class="auth-desc">계정에 로그인하고 오늘의 할 일을 확인하세요.</p>

        {% if error %}
        <p class="form-error">{{ error }}</p>
        {% endif %}

        <form method="post" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="username" class="form-label">아이디</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="아이디를 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button type="submit" class="btn btn--primary btn--lg btn--full">로그인</button>
        </form>

        <p class="auth-footer">
            계정이 없으신가요? <a href="{% url 'accounts:signup' %}" class="auth-link">회원가입</a>
        </p>
    </div>
</div>
{% endblock %}
