{% extends "base.html" %}
{% load static %}

{% block title %}비밀번호 변경 — Todo Yorisa{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-card">
        <a href="/" class="auth-logo">🍳 Todo Yorisa</a>
        <h1 class="auth-title">비밀번호 변경</h1>
        <p class="auth-desc">새로 사용할 비밀번호를 입력하세요.</p>

        <p id="password-edit-error" class="form-error"{% if not error %} style="display: none;"{% endif %}>{{ error }}</p>

        <form id="password-edit-form" method="post" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="new_password" class="form-label">새 비밀번호</label>
                <input type="password" id="new_password" name="new_password" class="form-input js-no-space" placeholder="8자 이상 입력하세요" required minlength="8">
            </div>

            <div class="form-group">
                <label for="new_password_confirm" class="form-label">새 비밀번호 확인</label>
                <input type="password" id="new_password_confirm" name="new_password_confirm" class="form-input js-no-space" placeholder="비밀번호를 다시 입력하세요" required minlength="8">
            </div>

            <button type="submit" class="btn btn--primary btn--lg btn--full">변경하기</button>
        </form>

        <p class="auth-footer">
            <a href="{% url 'accounts:mypage' %}" class="auth-link">취소하고 돌아가기</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_script %}
<script src="{% static 'js/accounts.js' %}"></script>
{% endblock %}
