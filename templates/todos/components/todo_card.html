{% load todo_extras %}
<div class="todo-card {% if todo.status == 'done' %}todo-card--done{% endif %}" id="todo-card-{{ todo.id }}">
    <button
        class="todo-card__select {% if todo.status == 'done' %}todo-card__select--selected{% endif %}"
        hx-post="/api/todos/{{ todo.id }}/status/"
        hx-target="#todo-card-{{ todo.id }}"
        hx-swap="outerHTML"
        hx-vals='{"status": "{% if todo.status == "done" %}todo{% else %}done{% endif %}"}'
    ></button>
    <div class="todo-card__body">
        <span class="todo-card__title">{{ todo.title }}</span>
        <div class="category-picker" id="cat-picker-{{ todo.id }}">
            <button
                class="todo-card__tag todo-card__tag--btn {% if todo.category %}{{ todo.category.id|color_class }}{% else %}todo-add-cat-btn--empty{% endif %}"
                onclick="toggleCatPicker('{{ todo.id }}', event)"
            >
                {% if todo.category %}{{ todo.category.name }}{% else %}+ 카테고리{% endif %}
            </button>
            <div class="category-picker__menu">
                <button
                    class="category-picker__option category-picker__option--none {% if not todo.category %}category-picker__option--active{% endif %}"
                    hx-post="/api/todos/{{ todo.id }}/category/"
                    hx-target="#todo-card-{{ todo.id }}"
                    hx-swap="outerHTML"
                    hx-vals='{"category_id": ""}'
                    onclick="closeCatPicker('{{ todo.id }}')"
                >없음</button>
                {% for cat in categories %}
                <button
                    class="category-picker__option {{ cat.id|color_class }} {% if todo.category.id == cat.id %}category-picker__option--active{% endif %}"
                    hx-post="/api/todos/{{ todo.id }}/category/"
                    hx-target="#todo-card-{{ todo.id }}"
                    hx-swap="outerHTML"
                    hx-vals='{"category_id": "{{ cat.id }}"}'
                    onclick="closeCatPicker('{{ todo.id }}')"
                >{{ cat.name }}</button>
                {% endfor %}
            </div>
        </div>
    </div>
    <form
        class="due-date-form"
        hx-post="/api/todos/{{ todo.id }}/due-date/"
        hx-target="#todo-card-{{ todo.id }}"
        hx-swap="outerHTML"
    >
        <div class="due-date-picker-wrap">
            <button
                type="button"
                class="due-badge due-badge--{{ todo.due_date|due_status }}"
                onclick="openDuePicker(this)"
            >
                📅 {% if todo.due_date %}{{ todo.due_date|date:"Y/n/j" }}{% else %}기한{% endif %}
            </button>
            <input
                type="date"
                name="due_date"
                value="{% if todo.due_date %}{{ todo.due_date|date:'Y-m-d' }}{% endif %}"
                class="due-date-input"
                onchange="this.form.requestSubmit()"
            >
        </div>
    </form>
    <div class="status-picker" id="picker-{{ todo.id }}">
        <button class="todo-card__status todo-card__status--{{ todo.status }}" onclick="togglePicker('{{ todo.id }}', event)">
            {{ todo.get_status_display }} ▾
        </button>
        <div class="status-picker__menu">
            <button
                class="status-picker__option status-picker__option--todo {% if todo.status == 'todo' %}status-picker__option--active{% endif %}"
                hx-post="/api/todos/{{ todo.id }}/status/"
                hx-target="#todo-card-{{ todo.id }}"
                hx-swap="outerHTML"
                hx-vals='{"status": "todo"}'
                onclick="closePicker('{{ todo.id }}')"
            >
                할 일
            </button>
            <button
                class="status-picker__option status-picker__option--in_progress {% if todo.status == 'in_progress' %}status-picker__option--active{% endif %}"
                hx-post="/api/todos/{{ todo.id }}/status/"
                hx-target="#todo-card-{{ todo.id }}"
                hx-swap="outerHTML"
                hx-vals='{"status": "in_progress"}'
                onclick="closePicker('{{ todo.id }}')"
            >
                진행 중
            </button>
            <button
                class="status-picker__option status-picker__option--done {% if todo.status == 'done' %}status-picker__option--active{% endif %}"
                hx-post="/api/todos/{{ todo.id }}/status/"
                hx-target="#todo-card-{{ todo.id }}"
                hx-swap="outerHTML"
                hx-vals='{"status": "done"}'
                onclick="closePicker('{{ todo.id }}')"
            >
                완료
            </button>
        </div>
    </div>
</div>
