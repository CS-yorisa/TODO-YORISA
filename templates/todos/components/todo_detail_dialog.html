<dialog id="todo-detail-dialog" class="todo-detail">
    <div class="todo-detail__view" id="todo-detail-view">
        <div class="todo-detail__header">
            <span class="todo-card__status" id="todo-detail-status"></span>
            <span class="todo-card__tag" id="todo-detail-category"></span>
        </div>
        <h2 class="todo-detail__title" id="todo-detail-title"></h2>
        <p class="todo-detail__due" id="todo-detail-due"></p>
        <p class="todo-detail__desc" id="todo-detail-desc"></p>

        <div class="todo-detail__actions">
            <button type="button" class="btn btn--outline" onclick="closeTodoDetail()">닫기</button>
            <button type="button" class="btn btn--primary" onclick="setTodoDetailMode('edit')">수정</button>
        </div>
    </div>

    <form class="todo-detail__form" id="todo-detail-form" style="display: none;">
        {% csrf_token %}
        <h2 class="todo-detail__form-title">할 일 수정</h2>

        <p class="form-error" id="todo-detail-error" style="display: none;"></p>

        <div class="form-group">
            <label for="todo-detail-input-title" class="form-label">제목</label>
            <input type="text" id="todo-detail-input-title" name="title" class="form-input" maxlength="200" required>
        </div>

        <div class="form-group">
            <label for="todo-detail-input-desc" class="form-label">설명</label>
            <textarea
                id="todo-detail-input-desc"
                name="description"
                class="form-input todo-detail__textarea"
                rows="4"
                placeholder="자세한 내용을 적어보세요"
            ></textarea>
        </div>

        <div class="todo-detail__actions">
            <button type="button" class="btn btn--outline" onclick="setTodoDetailMode('view')">취소</button>
            <button type="submit" class="btn btn--primary" id="todo-detail-save">저장</button>
        </div>
    </form>

    {# 보기 모드에서 상태 값·카테고리 id를 라벨로 바꾸기 위한 참조 목록 #}
    <ul id="todo-detail-status-labels" hidden>
        {% for value, label in Status.choices %}
        <li data-value="{{ value }}">{{ label }}</li>
        {% endfor %}
    </ul>
    <ul id="todo-detail-category-labels" hidden>
        {% for category in categories %}
        <li data-value="{{ category.id }}">{{ category.name }}</li>
        {% endfor %}
    </ul>
</dialog>
